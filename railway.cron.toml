[build]
builder = "nixpacks"

[deploy]
# 2026-10-27: same daily run also does the weekly promo + blister Cosmos
# Holo sync -- both commands exit straight away unless it's Monday (SAST),
# so no second cron service is needed. ";" (not "&&") so a failed price
# sync doesn't skip the Monday promo run.
# 2026-10-30: update_prep_time added first -- recalculates the order
# preparation time shown on the landing/checkout pages (fast, DB only).
startCommand = "python manage.py update_prep_time; python manage.py sync_prices_only; python manage.py sync_promos --weekly-day mon --email; python manage.py sync_blister_cosmos --weekly-day mon"
# ROOT CAUSE (2026-09-18, Michael: "the price sync is not working on the
# site!!!"): this file had a startCommand but no cronSchedule -- Railway's
# config-as-code cron field lives here (deploy.cronSchedule), sibling to
# startCommand. Without it, this service was never actually being told to
# run daily -- it either sat stopped after one run or restarted in a loop,
# but never on a schedule. Runs at 02:00 UTC = 04:00 SAST daily, an
# off-hours window. Cron schedules are always evaluated in UTC by Railway
# regardless of the service's own timezone.
cronSchedule = "0 2 * * *"
restartPolicyType = "never"
